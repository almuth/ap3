server:
  port: 8080
  mode: debug  # debug, release, test
  read_timeout: 60
  write_timeout: 60
  shutdown_timeout: 10

database:
  path: ../ahadpos3.db
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600  # seconds

jwt:
  secret: your-secret-key-change-in-production
  expiration: 24  # hours

log:
  level: debug  # debug, info, warn, error
  format: json  # json, text
  output: logs/app.log

cors:
  enabled: true
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - "*"
  max_age: 86400

pagination:
  default_page: 1
  default_page_size: 20
  max_page_size: 100

auth:
  bcrypt_cost: 10
